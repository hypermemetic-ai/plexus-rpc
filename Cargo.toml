[package]
name = "plexus-rpc"
# 0.2.0 (unpublished): adds the `__deps` re-export module consumed by
# plexus-macros 0.6 umbrella-qualified emission (Z2H-2). Minor bump —
# additive public surface (`__deps`) + promoted dependencies.
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Umbrella crate for Plexus RPC: re-exports plexus-auth-core, plexus-core, plexus-macros, and (optionally) plexus-transport at version-compatible pins, plus a capability manifest backends embed in _info."
repository = "https://github.com/hypermemetic/plexus-rpc"
homepage = "https://github.com/hypermemetic/plexus-rpc"
keywords = ["rpc", "jsonrpc", "websocket", "streaming"]
categories = ["network-programming", "asynchronous"]

# Why this exists:
#
# Consumers (substrate, mneme-substrate, plexus-trak, downstream backends) need
# core + macros + auth-core at version-compatible pins. Tracking three separate
# version bumps across coordinated releases is error-prone. `plexus-rpc` is the
# one-line dependency: `cargo add plexus-rpc` pins the verified-compatible set.
#
# The crate also exposes a `Capabilities` const so backends can embed it in
# _info; synapse + synapse-cc branch on capabilities rather than guessing from
# version strings. See plans/UMB/UMB-1.md in plexus-transport for the full
# design rationale.

[features]
# Default: the everyday backend deps. macros and core are always wanted (per
# the umbrella's reason for existing); auth-core ships with them because it
# carries the sealed primitives core re-exports. Transport is opt-in because
# embedded / WASM / test-only consumers don't always need a server.
default = ["transport"]

# Bring in plexus-transport (the WebSocket / HTTP / SSE server runtime).
# Drop this if you're only using the type / dispatch surface (e.g. embedded
# test fixtures, ahead-of-time codegen tools).
transport = ["dep:plexus-transport"]

# Forwarding features so umbrella consumers don't need a direct
# plexus-transport dep just to flip a transport sub-feature.
mcp-gateway = ["transport", "plexus-transport/mcp-gateway"]
http-gateway = ["transport", "plexus-transport/http-gateway"]
sqlite-sessions = ["transport", "plexus-transport/sqlite-sessions"]

[dependencies]
# Always required — the umbrella's reason for being is to pin these together.
plexus-auth-core = { path = "../plexus-auth-core", version = "0.1" }
plexus-core      = { path = "../plexus-core",      version = "0.5" }
plexus-macros    = { path = "../plexus-macros",    version = "0.6" }

# Optional — see the `transport` feature flag.
plexus-transport = { path = "../plexus-transport", version = "0.3", optional = true }

# Z2H-2: macro-emission dependencies, re-exported through `__deps` so that
# plexus-macros 0.6 can emit `::plexus_rpc::__deps::<crate>::...` paths.
# A consumer depending only on `plexus-rpc` (+ `jsonrpsee`, see below)
# compiles macro-annotated activations without naming any of these.
#
# `jsonrpsee` is re-exported too, BUT consumers still need it as a direct
# dependency: jsonrpsee's own `#[rpc]` proc-macro (which plexus-macros
# delegates server-trait generation to) runs its own lookup against the
# CONSUMER's Cargo.toml and hard-errors if `jsonrpsee` isn't listed there.
# Inlining that expansion into plexus-macros (true 1-dep) is a noted
# follow-up to Z2H-2.
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
schemars = { version = "1.1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serde for the Capabilities manifest (it serializes into _info) and for
# the `__deps::serde` re-export (the generated method enum derives
# Serialize/Deserialize through it).
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Z2H-2 anti-rot gate (tests/z2h2_dep_reexport.rs) scaffolds consumer crates
# into a tempdir farm.
tempfile = "3"

# Examples reference `plexus_core` and `plexus_macros` directly at the
# crate root (today's canonical direct-consumer shape). Library consumers
# depending only on `plexus-rpc` get the same surface via
# `plexus_rpc::core` and `plexus_rpc::macros`.
plexus-core = { path = "../plexus-core", version = "0.5" }
plexus-macros = { path = "../plexus-macros", version = "0.6" }

# Examples register with the registry by binding 4444 by default; the
# server lives behind the `transport` feature so the example only
# compiles when transport is on (the default).
[[example]]
name = "echo"
required-features = ["transport"]
